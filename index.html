        body {
            font-family: 'Share Tech Mono', monospace;
            background-color: #050505;
            color: #00ff00; /* Neon Green */
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            background-image: 
                linear-gradient(rgba(0, 255, 0, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 255, 0, 0.03) 1px, transparent 1px);
            background-size: 20px 20px;
        }

        h1, h2, h3, .title-font {
            font-family: 'Orbitron', sans-serif;
        }

        /* Hacker Themes CSS */
        .theme-7 { --neon: #00ff00; --bg: #002200; } /* Neon Green */
        .theme-8 { --neon: #00f3ff; --bg: #001f22; } /* Cyan */
        .theme-9 { --neon: #ff00ff; --bg: #220022; } /* Magenta */

        .terminal-container {
            border: 1px solid var(--neon);
            box-shadow: 0 0 10px var(--neon), inset 0 0 10px rgba(0,255,0,0.1);
            background: rgba(0, 0, 0, 0.8);
            position: relative;
        }

        .terminal-container::before {
            content: "NEXUS_OS v9.0.1";
            position: absolute;
            top: -10px;
            left: 10px;
            background: #050505;
            padding: 0 5px;
            font-size: 12px;
            color: var(--neon);
        }

        .btn-hack {
            background: transparent;
            border: 1px solid var(--neon);
            color: var(--neon);
            text-transform: uppercase;
            transition: all 0.2s;
            position: relative;
            overflow: hidden;
        }
        .btn-hack:hover {
            background: var(--neon);
            color: #000;
            box-shadow: 0 0 15px var(--neon);
        }
        .btn-hack:active {
            transform: scale(0.98);
        }

        /* Glitch Animation for Timer */
        @keyframes glitch {
            0% { transform: translate(0) }
            20% { transform: translate(-2px, 2px) }
            40% { transform: translate(-2px, -2px) }
            60% { transform: translate(2px, 2px) }
            80% { transform: translate(2px, -2px) }
            100% { transform: translate(0) }
        }
        .timer-danger {
            color: #ff003c;
            animation: glitch 0.3s infinite;
            text-shadow: 0 0 5px #ff003c;
        }

        /* Scanline Effect */
        .scanlines {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(to bottom, rgba(255,255,255,0), rgba(255,255,255,0) 50%, rgba(0,0,0,0.2) 50%, rgba(0,0,0,0.2));
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>

        const TIME_PER_QUESTION = 30; 
        const TOTAL_QS = 10;
        
        // --- AUDIO ENGINE ---
        const AudioSys = {
            ok: new Audio('success.mp3'),
            err: new Audio('error.mp3'),
            bgm: new Audio('bgm.mp3'),
            init() {
                this.bgm.loop = true;
                this.bgm.volume = 0.4;
            },
            play(t) {
                if(this[t]) {
                    this[t].currentTime = 0;
                    this[t].play().catch(()=>console.log("Audio blocked"));
                }
            },
            toggle(on) {
                on ? this.bgm.play().catch(()=>console.log("BGM blocked")) : this.bgm.pause();
            }
        };
        AudioSys.init();


        // === REACT APP ===
        function HackerApp() {
            const [state, setState] = useState('BOOT'); // BOOT, MAIN, SECTOR, HACKING, RESULT
            const [sector, setSector] = useState(null);
            const [level, setLevel] = useState(null);
            
            const [qIdx, setQIdx] = useState(0);
            const [score, setScore] = useState(0);
            const [corrects, setCorrects] = useState(0);
            const [time, setTime] = useState(TIME_PER_QUESTION);
            const [status, setStatus] = useState(null); // 'access_granted', 'access_denied'
            const [paused, setPaused] = useState(false);
            const [sfxOn, setSfxOn] = useState(true);
            const [bootLog, setBootLog] = useState("");

            const timerRef = useRef(null);
            const activeQs = useMemo(() => {
                if(sector && level) return allQuestionsData[sector].find(l => l.level === level)?.qs || [];
                return [];
            }, [sector, level]);

            // Fake Boot Sequence
            useEffect(() => {
                if(state === 'BOOT') {
                    const logs = [
                        "INITIALIZING NEXUS_OS...",
                        "BYPASSING FIREWALL...",
                        "ESTABLISHING SECURE CONNECTION...",
                        "CONNECTION ESTABLISHED.",
                        "WELCOME, HACKER."
                    ];
                    let i = 0;
                    const intv = setInterval(() => {
                        setBootLog(prev => prev + "\n> " + logs[i]);
                        i++;
                        if(i === logs.length) {
                            clearInterval(intv);
                            setTimeout(() => setState('MAIN'), 1000);
                        }
                    }, 400);
                    return () => clearInterval(intv);
                }
            }, [state]);

            useEffect(() => {
                if (state === 'HACKING' && !paused) {
                    if (time > 0) {
                        timerRef.current = setTimeout(() => setTime(time - 1), 1000);
                    } else {
                        checkAns(null, true);
                    }
                }
                return () => clearTimeout(timerRef.current);
            }, [state, time, paused]);

            useEffect(() => { AudioSys.toggle(sfxOn && state !== 'BOOT'); }, [sfxOn, state]);

            const startHack = (s, l) => {
                setSector(s); setLevel(l);
                setQIdx(0); setScore(0); setCorrects(0); setTime(TIME_PER_QUESTION);
                setStatus(null); setPaused(false);
                setState('HACKING');
            };

            const checkAns = (ans, timeout = false) => {
                if (paused || status) return;
                clearTimeout(timerRef.current);
                
                const currQ = activeQs[qIdx];
                const isRight = !timeout && ans === currQ.a;

                if (isRight) {
                    setStatus('access_granted');
                    if(sfxOn) AudioSys.play('ok');
                    setScore(prev => prev + 500 + (time * 10)); // Hacker scoring is bigger
                    setCorrects(prev => prev + 1);
                } else {
                    setStatus(timeout ? 'timeout' : 'access_denied');
                    if(sfxOn) AudioSys.play('err');
                }

                setPaused(true);
                setTimeout(() => {
                    setStatus(null); setPaused(false);
                    if (qIdx + 1 < TOTAL_QS) {
                        setQIdx(prev => prev + 1); setTime(TIME_PER_QUESTION);
                    } else {
                        setState('RESULT');
                    }
                }, isRight ? 800 : 1500); // Wait longer on error to see right answer
            };


            // -- RENDERERS --
            const cssTheme = sector ? `theme-${sector}` : 'theme-8'; // default cyan

            if(state === 'BOOT') {
                return (
                    <div className="h-full flex items-center p-8 bg-black">
                        <pre className="text-green-500 whitespace-pre-wrap">{bootLog}</pre>
                    </div>
                );
            }

            if(state === 'MAIN') {
                return (
                    <div className={`h-full flex flex-col items-center justify-center p-6 bg-black text-center theme-8`}>
                        <div className="mb-2 text-gray-500 tracking-widest text-sm">CYBER-SYNDICATE MAINFRAME</div>
                        <h1 className="text-5xl md:text-7xl font-bold mb-4 title-font" style={{color: 'var(--neon)', textShadow: '0 0 10px var(--neon)'}}>
                            MATH HACKER<br/><span className="text-3xl">NEXUS</span>
                        </h1>
                        <p className="max-w-lg mb-10 text-gray-400">Pecahkan algoritma enkripsi matematika untuk meretas server Syndicate. Dibutuhkan kecepatan dan ketepatan kalkulasi.</p>
                        
                        <button onClick={() => setState('SECTOR')} className="btn-hack px-10 py-4 text-2xl font-bold w-full max-w-sm">
                            [ INITIATE_HACK ]
                        </button>
                    </div>
                );
            }

            if(state === 'SECTOR') {
                return (
                    <div className="h-full flex flex-col items-center p-6 bg-black pt-10">
                        <h2 className="text-3xl mb-10 title-font" style={{color: '#00f3ff', textShadow: '0 0 10px #00f3ff'}}>SELECT TARGET SECTOR</h2>
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 w-full max-w-4xl">
                            {[7,8,9].map(g => (
                                <div key={g} className={`terminal-container p-6 flex flex-col justify-between h-48 theme-${g}`}>
                                    <div>
                                        <div className="text-xs text-gray-400 mb-2">TARGET: GRADE_{g}</div>
                                        <div className="text-2xl font-bold mb-2" style={{color: 'var(--neon)'}}>SECTOR 0{g}</div>
                                        <div className="text-sm opacity-80 mb-4">{g===7 ? 'Aljabar & Aritmetika' : g===8 ? 'Fungsi & Geometri' : 'Akar & Persamaan Kuadrat'}</div>
                                    </div>
                                    <div className="flex gap-2">
                                        <button onClick={()=>startHack(g,1)} className="btn-hack flex-1 py-2 text-sm">LVL_1</button>
                                        <button onClick={()=>startHack(g,2)} className="btn-hack flex-1 py-2 text-sm">LVL_2</button>
                                    </div>
                                </div>
                            ))}
                        </div>
                        <button onClick={() => setState('MAIN')} className="mt-12 text-gray-500 hover:text-white transition">{'< ABORT / RETURN'}</button>
                    </div>
                );
            }

            if(state === 'HACKING') {
                const q = activeQs[qIdx];
                const p = ((qIdx+1)/TOTAL_QS)*100;
                // --- KODE BARU UNTUK MENGACAK JAWABAN ---
                const shuffledOptions = useMemo(() => {
                if(!q) return [];
                return [...q.o].sort(() => Math.random() - 0.5);
                }, [qIdx, activeQs]);
                // ----------------------------------------    
                return (
                    <div className={`h-full flex flex-col bg-black pt-4 ${cssTheme}`}>
                        {/* Header Panel */}
                        <div className="flex justify-between items-center px-4 md:px-8 mb-4 border-b border-gray-800 pb-2">
                            <button onClick={()=>{setPaused(true); setState('SECTOR')}} className="text-gray-500 hover:text-white">{'[X] ABORT'}</button>
                            <div className="text-center">
                                <div className="text-xs text-gray-400 tracking-wider">SECTOR 0{sector} // LVL_{level}</div>
                                <div style={{color: 'var(--neon)'}}>{q.topic}</div>
                            </div>
                            <div className="flex items-center gap-4">
                                <button onClick={()=>setSfxOn(!sfxOn)}>{sfxOn ? 'SOUND_ON' : 'SOUND_OFF'}</button>
                                <div className="text-xl title-font font-bold">{String(score).padStart(6, '0')}</div>
                            </div>
                        </div>

                        {/* Progress */}
                        <div className="w-full bg-gray-900 h-1 mb-8">
                            <div className="h-full transition-all duration-300" style={{width: `${p}%`, background: 'var(--neon)', boxShadow: '0 0 10px var(--neon)'}}></div>
                        </div>

                        {/* Main Screen */}
                        <div className="flex-grow flex flex-col items-center justify-center p-4">
                            <div className="text-center w-full max-w-3xl">
                                <div className={`text-6xl font-bold mb-8 title-font ${time <= 5 ? 'timer-danger' : ''}`} style={{color: time>5 ? 'white' : ''}}>
                                    00:{String(time).padStart(2,'0')}
                                </div>

                                <div className="terminal-container p-8 md:p-12 mb-8 min-h-[200px] flex items-center justify-center relative">
                                    <h3 className="text-2xl md:text-4xl text-white font-medium leading-relaxed font-sans">{q.q}</h3>
                                    
                                    {/* Overlay Feedback */}
                                    {status && (
                                        <div className="absolute inset-0 flex flex-col items-center justify-center bg-black/90 backdrop-blur-sm z-10">
                                            {status === 'access_granted' ? (
                                                <div className="text-4xl title-font text-green-500 tracking-widest">[ ACCESS GRANTED ]</div>
                                            ) : (
                                                <div className="text-center">
                                                    <div className="text-4xl title-font text-red-600 tracking-widest mb-2 glitch">{status==='timeout' ? '[ TIME EXPIRED ]' : '[ ACCESS DENIED ]'}</div>
                                                    <div className="text-xl text-gray-400 font-sans mt-4">CORRECT HASH: <span className="text-green-400">{q.a}</span></div>
                                                </div>
                                            )}
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>

                        {/* Options */}
                        <div className="grid grid-cols-2 gap-4 p-4 max-w-4xl w-full mx-auto pb-8">
                            {q.o.map((opt, i) => (
                                <button key={i} onClick={()=>checkAns(opt)} disabled={!!status}
                                    className="btn-hack p-4 text-xl md:text-2xl font-sans font-bold flex items-center justify-center disabled:opacity-50 min-h-[80px]">
                                    {opt}
                                </button>
                            ))}
                        </div>
                    </div>
                );
            }

            if(state === 'RESULT') {
                const pass = corrects >= 6;
                return (
                    <div className={`h-full flex flex-col items-center justify-center p-6 bg-black ${cssTheme}`}>
                        <div className="terminal-container p-10 max-w-lg w-full text-center">
                            <h2 className="text-4xl title-font font-bold mb-2" style={{color: pass ? 'var(--neon)' : '#ff003c'}}>
                                {pass ? 'HACK SUCCESSFUL' : 'HACK FAILED'}
                            </h2>
                            <div className="text-gray-400 mb-8 border-b border-gray-800 pb-4">SECTOR 0{sector} // ENCRYPTION LVL {level}</div>
                            
                            <div className="flex justify-around mb-8">
                                <div>
                                    <div className="text-xs text-gray-500 mb-1">NODES DECRYPTED</div>
                                    <div className="text-4xl text-white">{corrects}<span className="text-lg text-gray-500">/10</span></div>
                                </div>
                                <div>
                                    <div className="text-xs text-gray-500 mb-1">DATA REWARD</div>
                                    <div className="text-4xl title-font" style={{color: 'var(--neon)'}}>{score}</div>
                                </div>
                            </div>

                            {!pass && <div className="text-red-500 mb-8 text-sm">Peringatan: Sistem keamanan Syndicate mendeteksi terlalu banyak error (Minimal butuh 6 jawaban benar).</div>}

                            <div className="flex gap-4">
                                <button onClick={()=>setState('SECTOR')} className="btn-hack px-6 py-3 flex-1">NEW TARGET</button>
                                {pass && level === 1 ? (
                                    <button onClick={()=>startHack(sector, 2)} className="btn-hack px-6 py-3 flex-1" style={{background: 'var(--neon)', color: '#000'}}>DEEP HACK Lvl 2</button>
                                ) : (
                                    <button onClick={()=>startHack(sector, level)} className="btn-hack px-6 py-3 flex-1">RETRY HACK</button>
                                )}
                            </div>
                        </div>
                    </div>
                );
            }
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<HackerApp />);
    </script>
</body>
</html>
